<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Dice Roller</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%); /* Icy blue background */
            color: #1e293b;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 2px solid #e2e8f0;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            margin-top: 0;
            font-size: 28px;
            color: #0f172a;
        }
        /* Penguin Container holding the die */
        .penguin {
            position: relative;
            width: 140px;
            height: 160px;
            background: #0f172a; /* Penguin main black body */
            border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 16px rgba(15, 23, 42, 0.2);
        }
        /* White belly */
        .penguin::before {
            content: '';
            position: absolute;
            bottom: 10px;
            width: 100px;
            height: 110px;
            background: #ffffff;
            border-radius: 50%;
            z-index: 1;
        }
        /* Penguin Eyes */
        .eyes {
            position: absolute;
            top: 25px;
            width: 55px;
            display: flex;
            justify-content: space-between;
            z-index: 3;
        }
        .eye {
            width: 12px;
            height: 12px;
            background: #000;
            border-radius: 50%;
        }
        /* Penguin Beak */
        .beak {
            position: absolute;
            top: 38px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 14px solid #f97316; /* Orange beak */
            z-index: 3;
        }
        /* Penguin Feet */
        .feet {
            position: absolute;
            bottom: -8px;
            width: 110px;
            display: flex;
            justify-content: space-between;
            z-index: 0;
        }
        .foot {
            width: 32px;
            height: 16px;
            background: #f97316;
            border-radius: 50% 50% 30% 30%;
        }
        /* The Dice Face inside the belly */
        #dice {
            font-size: 60px;
            font-weight: bold;
            z-index: 2;
            color: #334155;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s;
        }
        /* Roll Button */
        button {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #0284c7; /* Sky blue button */
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
        }
        button:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        /* Waddling Animation Effect */
        @keyframes waddle {
            0% { transform: rotate(0deg) translateY(0); }
            25% { transform: rotate(-10deg) translateY(-10px); }
            50% { transform: rotate(10deg) translateY(0); }
            75% { transform: rotate(-10deg) translateY(-10px); }
            100% { transform: rotate(0deg) translateY(0); }
        }
        .rolling {
            animation: waddle 0.5s ease-in-out;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Penguin Dice Roller</h1>
    
    <!-- CSS-styled cute penguin holding the die -->
    <div class="penguin" id="penguin">
        <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
        </div>
        <div class="beak"></div>
        <div id="dice">⚀</div>
        <div class="feet">
            <div class="foot"></div>
            <div class="foot"></div>
        </div>
    </div>

    <button onclick="rollDice()">Waddle & Roll!</button>
</div>

<script>
    // Unicode dice characters 1-6
    const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    function rollDice() {
        const penguinElement = document.getElementById("penguin");
        const diceElement = document.getElementById("dice");
        
        // Prevent clicking again while already animating
        if (penguinElement.classList.contains("rolling")) return;
        
        // Add the penguin waddle animation class
        penguinElement.classList.add("rolling");
        
        // Rapidly shuffle dice faces during the animation
        let shuffleCount = 0;
        const shuffleInterval = setInterval(() => {
            const randomFakeIndex = Math.floor(Math.random() * 6);
            diceElement.innerText = diceFaces[randomFakeIndex];
            shuffleCount++;
            
            if (shuffleCount > 8) {
                clearInterval(shuffleInterval);
                // Set final result
                const finalResult = Math.floor(Math.random() * 6);
                diceElement.innerText = diceFaces[finalResult];
            }
        }, 50);

        // Remove the animation class once it finishes so it can run next time
        setTimeout(() => {
            penguinElement.classList.remove("rolling");
        }, 500);
    }
</script>

</body>
</html>
